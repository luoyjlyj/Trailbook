<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>路书 · Web运营管理后台原型</title>
<style>
:root{--ink:#1e342c;--muted:#839187;--green:#246352;--green2:#174b3f;--mint:#e8f1e9;--mint2:#dce9dc;--paper:#f6f7f3;--white:#fff;--line:#e8ece6;--amber:#c88650;--amberbg:#fff1e4;--blue:#6b8e9d;--shadow:0 10px 35px rgba(32,59,45,.08);--sidebar:248px}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--paper)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid rgba(75,143,112,.23);outline-offset:2px}
.app{min-height:100vh;display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr)}
.sidebar{position:fixed;inset:0 auto 0 0;width:var(--sidebar);background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:22px 14px 16px;z-index:5}
.brand{display:flex;align-items:center;gap:11px;padding:0 11px 24px}
.brand-mark{width:38px;height:38px;border-radius:13px 13px 13px 4px;background:var(--green);display:grid;place-items:center;color:#fff;box-shadow:0 7px 18px rgba(36,99,82,.19)}
.brand-mark svg{width:23px;height:23px}
.brand-name{font-size:17px;font-weight:850;letter-spacing:.03em}
.brand-name small{display:block;font-size:9px;letter-spacing:.15em;color:#9aa69e;font-weight:700;margin-top:2px}
.workspace{margin:0 5px 20px;padding:11px 12px;background:#f4f6f1;border:1px solid #ebeee8;border-radius:13px;display:flex;align-items:center;gap:10px}
.workspace-dot{width:9px;height:9px;border-radius:50%;background:#71a27e;box-shadow:0 0 0 4px #e2eee2}
.workspace strong{font-size:11px;display:block}
.workspace small{font-size:9px;color:var(--muted);display:block;margin-top:3px}
.nav-label{padding:0 12px;margin:13px 0 7px;color:#a0aaa2;font-size:9px;letter-spacing:.14em;font-weight:800}
.nav{display:grid;gap:4px}
.nav button{position:relative;width:100%;display:flex;align-items:center;gap:12px;border:0;background:transparent;color:#718077;text-align:left;border-radius:11px;padding:11px 12px;font-size:12px;font-weight:650;transition:.16s}
.nav button:hover{background:#f4f6f2;color:var(--green)}
.nav button.active{background:#e9f1e9;color:var(--green);font-weight:800}
.nav button.active:before{content:"";position:absolute;left:-14px;top:10px;bottom:10px;width:3px;background:var(--green);border-radius:0 4px 4px 0}
.nav .ico{width:18px;height:18px;display:grid;place-items:center;color:inherit;flex:0 0 auto}
.nav svg{width:18px;height:18px}
.nav .count{margin-left:auto;background:#fff0e4;color:#bb794d;border-radius:99px;min-width:21px;text-align:center;padding:3px 6px;font-size:9px;font-weight:800}
.sidebar-foot{margin-top:auto;border-top:1px solid var(--line);padding:15px 9px 0;display:flex;align-items:center;gap:10px}
.avatar{width:33px;height:33px;border-radius:50%;background:#d9e8db;color:var(--green);display:grid;place-items:center;font-size:11px;font-weight:850}
.sidebar-foot strong{font-size:10px;display:block}
.sidebar-foot small{font-size:9px;color:var(--muted);display:block;margin-top:3px}
.sidebar-foot .more{margin-left:auto;border:0;background:transparent;color:#89968d;font-size:18px}
.main{grid-column:2;min-width:0}
.topbar{height:72px;position:sticky;top:0;z-index:4;background:rgba(255,255,255,.93);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 34px}
.mobile-menu{display:none;border:0;background:#f2f5f0;color:var(--green);width:36px;height:36px;border-radius:10px}
.crumb{min-width:180px}
.crumb small{display:block;color:#9aa69e;font-size:9px;margin-bottom:3px}
.crumb strong{font-size:13px}
.top-search{height:36px;max-width:320px;flex:1;display:flex;align-items:center;gap:8px;background:#f5f7f3;border:1px solid #edf0e9;border-radius:10px;padding:0 11px;color:#92a096}
.top-search input{width:100%;border:0;outline:0;background:transparent;font-size:10px;color:var(--ink)}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:10px}
.select-city{height:35px;border:1px solid #e7ebe4;border-radius:10px;background:#fff;padding:0 10px;color:#617267;font-size:10px}
.icon-button{width:35px;height:35px;border:1px solid #e8ece6;background:#fff;border-radius:10px;color:#738178;display:grid;place-items:center;position:relative}
.icon-button svg{width:17px;height:17px}
.notification-dot{position:absolute;width:6px;height:6px;border-radius:50%;background:#e08e61;right:7px;top:7px;border:1px solid #fff}
.top-user{display:flex;align-items:center;gap:8px;margin-left:2px}
.top-user .avatar{width:31px;height:31px}
.top-user strong{font-size:10px}
.top-user small{display:block;color:#9aa69e;font-size:8px;margin-top:2px}
.content{max-width:1520px;margin:0 auto;padding:30px 34px 54px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:23px}
.page-head h1{font-size:25px;letter-spacing:-.04em;margin:0 0 5px}
.page-head p{font-size:11px;color:var(--muted);margin:0;line-height:1.55}
.eyebrow{color:var(--green);font-size:9px;letter-spacing:.15em;font-weight:850;margin-bottom:7px}
.head-actions{display:flex;gap:8px;align-items:center}
.btn{border:1px solid #dfe7df;background:#fff;color:#577063;border-radius:9px;padding:9px 12px;font-size:10px;font-weight:750;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap}
.btn:hover{border-color:#b8d0bd;background:#f8fbf7}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 5px 12px rgba(36,99,82,.12)}
.btn.primary:hover{background:var(--green2)}
.btn.soft{background:#eaf2e9;border-color:#eaf2e9;color:var(--green)}
.btn.danger{color:#b86c53;background:#fff9f6;border-color:#f1dfd8}
.btn.small{padding:6px 9px;font-size:9px}
.grid{display:grid;gap:15px}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:17px}
.card{background:#fff;border:1px solid #e9ede7;border-radius:15px;box-shadow:0 2px 8px rgba(36,64,48,.025)}
.kpi{padding:17px 18px;min-height:117px;position:relative;overflow:hidden}
.kpi-top{display:flex;align-items:center;justify-content:space-between}
.kpi-label{font-size:10px;color:#829087;font-weight:650}
.kpi-icon{width:31px;height:31px;border-radius:10px;background:#edf4ec;color:var(--green);display:grid;place-items:center}
.kpi-icon svg{width:16px;height:16px}
.kpi-value{font-size:27px;letter-spacing:-.05em;font-weight:800;margin:12px 0 5px}
.kpi-foot{font-size:9px;color:#8c9990}
.up{color:#4d9665;font-weight:800}
.down{color:#bb7956;font-weight:800}
.two-col{grid-template-columns:minmax(0,1.55fr) minmax(320px,1fr);margin-bottom:16px}
.card-head{padding:16px 18px 0;display:flex;align-items:center;justify-content:space-between;gap:10px}
.card-head h2{font-size:12px;margin:0;font-weight:800}
.card-head p{font-size:9px;color:#98a39b;margin:4px 0 0}
.card-head .more-link{border:0;background:none;color:var(--green);font-size:9px;font-weight:750}
.chart-area{padding:11px 15px 15px}
.chart-legend{display:flex;gap:14px;color:#929e95;font-size:9px;padding:4px 3px 5px}
.legend-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;background:#4f8974}
.legend-dot.orange{background:#d9a170}
.chart{width:100%;height:190px;display:block}
.chart-grid{stroke:#edf0ea;stroke-width:1}
.chart-text{font-size:8px;fill:#a3ada5}
.chart-line{fill:none;stroke:#4a8870;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.chart-area-fill{fill:url(#fillGreen);opacity:.8}
.chart-line2{fill:none;stroke:#d7a06f;stroke-width:2;stroke-dasharray:5 5}
.source-mini-list{padding:6px 17px 15px}
.source-mini{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f0f2ed}
.source-mini:last-child{border:0}
.source-thumb{width:35px;height:35px;border-radius:10px;background:linear-gradient(145deg,#355f50,#c5d5b3);color:#fff;display:grid;place-items:center;font-size:13px}
.source-info{min-width:0;flex:1}
.source-info strong{display:block;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.source-info small{display:block;font-size:8px;color:#9aa59d;margin-top:4px}
.pill{display:inline-flex;align-items:center;border-radius:99px;padding:5px 8px;font-size:8px;font-weight:750;white-space:nowrap}
.pill.green{background:#e8f2e8;color:#4c8662}
.pill.amber{background:#fff0e3;color:#b7774c}
.pill.gray{background:#f0f2ee;color:#89958c}
.pill.blue{background:#eaf2f5;color:#5d8494}
.table-card{overflow:hidden}
.table-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid #edf0ea}
.toolbar-left,.toolbar-right{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.filter-chip{border:1px solid #e5eae3;background:#fff;color:#88958b;border-radius:99px;padding:7px 10px;font-size:9px;font-weight:700}
.filter-chip.active{background:#e7f0e7;color:var(--green);border-color:#d9e8da}
.table-search{height:31px;display:flex;align-items:center;gap:6px;border:1px solid #e8ece6;border-radius:8px;padding:0 9px;color:#a0aaa2}
.table-search input{border:0;outline:0;width:155px;font-size:9px}
table{width:100%;border-collapse:collapse}
th{text-align:left;background:#fafbf8;color:#98a39a;font-size:8px;font-weight:800;letter-spacing:.06em;padding:11px 14px;white-space:nowrap}
td{padding:12px 14px;border-top:1px solid #f0f2ed;color:#586a5f;font-size:9px;vertical-align:middle}
tbody tr:hover{background:#fbfcf9}
.row-title{display:flex;align-items:center;gap:9px;min-width:170px}
.row-thumb{width:35px;height:35px;border-radius:9px;display:grid;place-items:center;color:#fff;font-size:14px;flex:0 0 auto;background:linear-gradient(145deg,#4b7862,#a9b996)}
.row-thumb.food{background:linear-gradient(145deg,#b16c4d,#efbf8c)}
.row-thumb.night{background:linear-gradient(145deg,#263c57,#dfad63)}
.row-title strong{display:block;color:#31463a;font-size:9px}
.row-title small{display:block;font-size:8px;color:#9ca79e;margin-top:3px}
.row-actions{display:flex;gap:5px;align-items:center}
.row-actions button{border:0;background:transparent;color:var(--green);font-size:9px;font-weight:750;padding:5px}
.row-actions button:hover{text-decoration:underline}
.page-grid{grid-template-columns:minmax(0,1.45fr) minmax(300px,.85fr)}
.progress-card{padding:17px}
.progress-top{display:flex;align-items:center;justify-content:space-between}
.progress-top strong{font-size:11px}
.progress-top small{color:#929f94;font-size:9px}
.progress-line{height:6px;background:#eef1eb;border-radius:99px;margin:13px 0 8px;overflow:hidden}
.progress-line i{display:block;height:100%;width:72%;background:#5b9574;border-radius:99px}
.barset{display:grid;grid-template-columns:repeat(7,1fr);align-items:end;gap:10px;height:130px;padding:10px 5px 0;border-bottom:1px solid #eef0eb}
.barcol{display:flex;flex-direction:column;align-items:center;justify-content:end;gap:7px;height:100%}
.bar{width:min(25px,70%);border-radius:5px 5px 2px 2px;background:#dbe9dc;position:relative}
.bar.active{background:#52896c}
.barcol small{font-size:8px;color:#9aa59d}
.insight-box{padding:13px;border-radius:12px;background:#f1f6ef;margin:12px 17px;color:#647a68}
.insight-box strong{font-size:9px}
.insight-box p{font-size:8px;line-height:1.5;margin:5px 0 0;color:#87968a}
.section-gap{margin-top:16px}
.score-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:17px}
.score-row{border:1px solid #edf0ea;border-radius:12px;padding:12px}
.score-row-top{display:flex;align-items:center;justify-content:space-between}
.score-row strong{font-size:10px}
.score-row output{font-size:10px;color:var(--green);font-weight:800}
.score-row small{display:block;color:#96a197;font-size:8px;margin-top:4px}
.score-row input{width:100%;margin:11px 0 0;accent-color:var(--green)}
.toggle-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #eff1ec}
.toggle-row:last-child{border:0}
.toggle{appearance:none;width:32px;height:18px;border-radius:99px;background:#dfe5de;position:relative;transition:.18s;flex:0 0 auto}
.toggle:before{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:white;box-shadow:0 1px 4px #0002;transition:.18s}
.toggle:checked{background:#5d9675}
.toggle:checked:before{transform:translateX(14px)}
.toggle-row strong{font-size:9px;display:block}
.toggle-row small{font-size:8px;color:#98a49a;display:block;margin-top:3px}
.route-layout{display:grid;grid-template-columns:minmax(310px,.85fr) minmax(400px,1.2fr);gap:14px}
.route-panel{padding:15px}
.day-tabs{display:flex;gap:6px;margin-bottom:14px}
.day-tabs button{border:1px solid #e6ebe4;background:#fff;border-radius:9px;padding:8px 11px;color:#87948a;font-size:9px}
.day-tabs button.active{background:var(--green);color:#fff;border-color:var(--green)}
.stop{display:grid;grid-template-columns:47px 15px minmax(0,1fr);gap:8px;position:relative;padding:10px 0}
.stop-time{font-size:9px;color:#73847a;font-weight:800;padding-top:2px}
.stop-line{position:relative;display:flex;justify-content:center}
.stop-line:before{content:"";position:absolute;top:10px;bottom:-14px;border-left:1px dashed #c8d6c9}
.stop:last-child .stop-line:before{display:none}
.stop-dot{width:9px;height:9px;border:2px solid var(--green);border-radius:50%;background:#fff;position:relative;z-index:1}
.stop.food .stop-dot{border-color:#d68b61}
.stop-card{border:1px solid #edf0ea;border-radius:11px;padding:10px 11px;cursor:pointer}
.stop-card:hover{border-color:#b8d0bd;background:#fcfefb}
.stop-card strong{font-size:10px;display:block}
.stop-card p{font-size:8px;color:#8c9990;line-height:1.45;margin:4px 0 0}
.stop-meta{display:flex;gap:6px;margin-top:7px}
.map-card{position:relative;min-height:465px;overflow:hidden;border-radius:14px;background:#e9efe7;border:1px solid #e0e8de}
.map-svg{position:absolute;inset:0;width:100%;height:100%}
.map-badge{position:absolute;top:13px;left:14px;border:1px solid #dce5dc;background:#fffEFAe8;border-radius:10px;padding:9px 11px;font-size:9px;color:#637868;box-shadow:0 5px 16px #273e2c12}
.map-key{position:absolute;right:14px;top:14px;background:#fff;border:1px solid #e7ece5;border-radius:10px;padding:9px 11px;display:grid;gap:7px;font-size:8px;color:#7d8a80}
.key-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:5px}
.key-dot.orange{background:#d7875f}
.map-marker{position:absolute;width:29px;height:29px;border:2px solid #fff;border-radius:10px 10px 10px 3px;background:var(--green);color:#fff;display:grid;place-items:center;box-shadow:0 5px 13px #263d2c30;font-size:9px;font-weight:850;cursor:pointer}
.map-marker.food{background:#d7875f}
.map-marker.m1{left:17%;top:70%}.map-marker.m2{left:35%;top:54%}.map-marker.m3{left:57%;top:44%}.map-marker.m4{left:76%;top:28%}
.map-caption{position:absolute;bottom:14px;left:14px;background:#fff;border-radius:10px;padding:8px 10px;font-size:8px;color:#748579}
.route-tip{font-size:8px;line-height:1.5;color:#94a095;margin:10px 2px 0}
.source-connectors{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.connector{padding:15px}
.connector-head{display:flex;align-items:center;gap:10px}
.connector-logo{width:35px;height:35px;border-radius:11px;background:#f3e5dd;color:#a3654d;display:grid;place-items:center;font-size:13px;font-weight:850}
.connector:nth-child(2) .connector-logo{background:#ebedf6;color:#6671a0}
.connector:nth-child(3) .connector-logo{background:#e5f1e8;color:#3f8860}
.connector h3{font-size:10px;margin:0}
.connector p{font-size:8px;color:#94a097;line-height:1.5;margin:11px 0}
.connector .btn{width:100%}
.settings-grid{grid-template-columns:minmax(0,1.3fr) minmax(280px,.8fr)}
.settings-item{padding:15px 17px;border-bottom:1px solid #eef1eb}
.settings-item:last-child{border:0}
.settings-item strong{display:block;font-size:10px}
.settings-item small{display:block;color:#939f95;font-size:8px;margin-top:4px}
.settings-item .state{float:right}
.segmented{display:flex;gap:4px;background:#f3f5f1;border-radius:9px;padding:3px}
.segmented button{border:0;background:transparent;color:#859187;padding:7px 11px;border-radius:7px;font-size:9px}
.segmented button.active{background:#fff;color:var(--green);box-shadow:0 1px 4px #183c2b12}
.empty-note{padding:26px;text-align:center;color:#97a39a;font-size:9px}
.modal-backdrop{position:fixed;inset:0;background:rgba(18,34,27,.38);backdrop-filter:blur(3px);z-index:20;display:none;align-items:center;justify-content:center;padding:20px}
.modal-backdrop.open{display:flex}
.modal{width:min(520px,100%);background:#fff;border-radius:17px;box-shadow:0 24px 80px #14261c40;overflow:hidden;animation:appear .16s ease-out}
@keyframes appear{from{opacity:0;transform:translateY(7px) scale(.99)}to{opacity:1;transform:none}}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 19px;border-bottom:1px solid #edf0ea}
.modal-head h2{font-size:13px;margin:0}
.modal-head button{border:0;background:#f3f5f1;border-radius:8px;width:28px;height:28px;color:#7e8c81}
.modal-body{padding:18px 19px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:grid;gap:6px}
.field.full{grid-column:1/-1}
.field label{font-size:9px;color:#748278;font-weight:750}
.field input,.field select,.field textarea{width:100%;border:1px solid #e6ebe4;border-radius:9px;background:#fff;padding:9px 10px;font-size:10px;color:var(--ink)}
.field textarea{min-height:72px;resize:vertical}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:13px 19px;border-top:1px solid #edf0ea}
.toast{position:fixed;right:25px;bottom:24px;z-index:30;background:#244f40;color:#fff;padding:11px 15px;border-radius:11px;box-shadow:0 9px 30px #203b2e30;font-size:10px;opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s}
.toast.show{opacity:1;transform:none}
@media(max-width:1180px){:root{--sidebar:218px}.content{padding:25px 23px}.topbar{padding:0 23px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.source-connectors{grid-template-columns:1fr}}
@media(max-width:850px){:root{--sidebar:0px}.app{display:block}.sidebar{transform:translateX(-100%);transition:.2s;width:248px;box-shadow:var(--shadow)}.sidebar.open{transform:none}.main{margin:0}.mobile-menu{display:grid;place-items:center}.topbar{padding:0 15px;gap:10px}.crumb{min-width:0}.top-search{max-width:none}.top-actions .select-city,.top-user div:not(.avatar){display:none}.content{padding:22px 15px 40px}.two-col,.page-grid,.route-layout,.settings-grid{grid-template-columns:1fr}.route-layout{gap:12px}.map-card{min-height:360px}}
@media(max-width:560px){.topbar{height:60px}.crumb small{display:none}.crumb strong{font-size:11px}.top-search{display:none}.content{padding-top:17px}.page-head{align-items:flex-start;flex-direction:column}.head-actions{align-self:stretch}.kpis{grid-template-columns:1fr 1fr;gap:9px}.kpi{padding:12px;min-height:105px}.kpi-value{font-size:23px}.two-col{gap:10px}.table-card{overflow-x:auto}.table-toolbar{min-width:650px}table{min-width:680px}.source-connectors{grid-template-columns:1fr}.score-grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.map-card{min-height:330px}.top-actions{gap:5px}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18.5 9.2 5l4.2 9.5 2.1-5 4.5 9"/><path d="M7 18.5h13"/></svg></div>

var TITLES={overview:["运营总览","工作台"],trips:["用户行程","工作台"],sources:["攻略来源审核","内容运营"],places:["地点与美食库","内容运营"],routes:["路线方案","内容运营"],rules:["AI 推荐规则","内容运营"],analytics:["数据分析","数据分析"],settings:["服务与设置","系统"]};
var ICONS={
grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
calendar:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4m8-4v4M3 10h18"/>',
inbox:'<path d="M4 4h16v15H4z"/><path d="M4 13h4l2 3h4l2-3h4"/>',
pin:'<path d="M12 21s7-6.3 7-12a7 7 0 1 0-14 0c0 5.7 7 12 7 12Z"/><circle cx="12" cy="9" r="2.3"/>',
route:'<path d="M3 18h3a3 3 0 0 0 3-3V9a3 3 0 0 1 3-3h5"/><path d="m14 3 4 3-4 3"/><circle cx="3" cy="18" r="1"/><circle cx="20" cy="18" r="1"/>',
sliders:'<path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2"/><circle cx="16" cy="17" r="2"/>',
chart:'<path d="M4 19V5m0 14h17"/><path d="m7 15 4-5 3 2 6-7"/>',
settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-1.8 1.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5v.2h-2.6v-.2a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1-1.8-1.8.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H6v-2.6h.2a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1 1.8-1.8.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.5V5h2.6v.2a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1 1.8 1.8-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.5 1h.2v2.6h-.2a1.7 1.7 0 0 0-1.5 1Z"/>',
search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/>',
bell:'<path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/>',
book:'<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21z"/><path d="M4 5.5V21M8 7h8M8 11h8"/>',
map:'<path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3Z"/><path d="M9 3v15m6-12v15"/>',
cloud:'<path d="M7 18a5 5 0 1 1 .8-9.9A6 6 0 0 1 19 10a4 4 0 0 1-1 8Z"/>',
spark:'<path d="m12 2 2.5 7.5L22 12l-7.5 2.5L12 22l-2.5-7.5L2 12l7.5-2.5Z"/>'
};
function fillIcons(root){root.querySelectorAll("[data-ico]").forEach(function(el){var path=ICONS[el.getAttribute("data-ico")];if(path)el.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+path+'</svg>'})}
function toast(message){var el=document.getElementById("toast");el.textContent=message;el.classList.add("show");clearTimeout(window._toastTimer);window._toastTimer=setTimeout(function(){el.classList.remove("show")},2400)}
function setPage(page){
  var tpl=document.getElementById("tpl-"+page);if(!tpl)return;
  document.getElementById("content").innerHTML=tpl.innerHTML;
  document.querySelectorAll(".nav [data-page]").forEach(function(b){b.classList.toggle("active",b.getAttribute("data-page")===page)});
  document.getElementById("page-title").textContent=TITLES[page][0];
  document.getElementById("crumb-group").textContent=TITLES[page][1];
  document.getElementById("content").scrollTop=0;
  fillIcons(document);
  if(document.getElementById("sidebar").classList.contains("open"))document.getElementById("sidebar").classList.remove("open");
}
var MODAL_FIELDS={
source:'<div class="form-grid"><div class="field full"><label>攻略链接或原文</label><textarea required placeholder="粘贴用户授权分享的链接，或直接录入文字"></textarea></div><div class="field"><label>来源类型</label><select><option>用户分享</option><option>图文攻略</option><option>短视频攻略</option></select></div><div class="field"><label>关联城市</label><select><option>重庆</option><option>成都</option><option>杭州</option></select></div><div class="field full"><label>运营备注</label><input placeholder="选填：导入人、需要复核的内容"></div></div>',
place:'<div class="form-grid"><div class="field"><label>地点名称</label><input required placeholder="例如：洪崖洞观景区"></div><div class="field"><label>地点类型</label><select><option>景点 / 街区</option><option>特色美食</option><option>夜间体验</option></select></div><div class="field"><label>推荐时段</label><select><option>白天</option><option>午餐</option><option>晚餐</option><option>夜间</option><option>全天</option></select></div><div class="field"><label>城市</label><select><option>重庆</option><option>成都</option><option>杭州</option></select></div><div class="field full"><label>推荐说明</label><textarea placeholder="填写来源依据、游览建议和需要核验的信息"></textarea></div></div>',
route:'<div class="form-grid"><div class="field full"><label>路线名称</label><input required placeholder="例如：重庆 · 三天两夜经典线"></div><div class="field"><label>城市</label><select><option>重庆</option><option>成都</option></select></div><div class="field"><label>行程天数</label><select><option>3 天 2 夜</option><option>2 天 1 夜</option><option>1 日游</option></select></div><div class="field full"><label>适合人群 / 标签</label><input placeholder="慢节奏、夜景、美食"></div></div>',
service:'<div class="form-grid"><div class="field full"><label>服务类型</label><select><option>地图与路线服务</option><option>天气预报服务</option><option>AI 内容解析</option></select></div><div class="field full"><label>服务端配置名称</label><input placeholder="例如 MAP_PROVIDER_KEY" autocomplete="off"></div><div class="field full"><label>状态说明</label><textarea placeholder="密钥应保存在服务端环境变量或密钥管理服务中；本原型不会提交真实密钥。"></textarea></div></div>'
};
function openModal(kind,title){
  var backdrop=document.getElementById("modal-backdrop");
  document.getElementById("modal-title").textContent=title||({source:"导入攻略线索",place:"新增地点",route:"新建路线方案",service:"配置服务"}[kind]||"新增内容");
  document.getElementById("modal-body").innerHTML=MODAL_FIELDS[kind]||MODAL_FIELDS.source;
  backdrop.classList.add("open");
  var first=backdrop.querySelector("input,textarea,select");if(first)setTimeout(function(){first.focus()},50);
}
function closeModal(){document.getElementById("modal-backdrop").classList.remove("open")}
function filterRows(selector,attribute,value){
  document.querySelectorAll(selector).forEach(function(row){
    var match=value==="all"||row.getAttribute(attribute)===value;
    row.style.display=match?"":"none";
  });
}
function updateWeights(root){
  var inputs=[].slice.call(root.querySelectorAll("[data-weight]"));
  var total=inputs.reduce(function(sum,input){var n=Number(input.value);input.closest(".score-row").querySelector("output").textContent=n+"%";return sum+n},0);
  var out=root.querySelector("#weight-total");if(out){out.textContent="总计 "+total+"%";out.className="pill "+(total===100?"green":"amber")}
}
function renderRouteDay(day){
  var data=[
    [['18:30','抵达重庆 · 住宿地入住','以用户酒店位置作为当天起点，晚间不安排跨区远行。','起点','弹性时间'],['20:00','住处附近特色晚餐','依营业时间与当前位置筛选，店铺信息需出发前核实。','晚餐','美食'],['21:15','轻松夜景散步（可选）','晚到且体力允许时安排，结束后优先回到住宿地。','夜间','可跳过']],
    [['09:00','从住宿地出发','以用户住宿位置作为当天路线起点。','起点','步行 / 地铁'],['09:40','山城步道','白天步行体验，按天气、坡度和体力建议停留。','白天','城市漫步'],['12:10','十八梯附近小面','午餐放在上午游览片区，减少跨区移动。','午餐','特色美食'],['15:30','戴家巷街巷漫步','傍晚前结束户外活动，雨天可换室内候选。','下午','雨天可替换'],['19:30','洪崖洞夜景','安排在晚餐后，路线需包含返回住处的交通。','夜间','夜景']],
    [['09:00','住处附近早餐','选择营业较早的店，退房和返程前留出缓冲。','早餐','不赶时间'],['10:30','附近自由活动','只保留轻量安排，避免返程日跨区游览。','弹性','可跳过'],['14:00','前往车站 / 机场','交通方式和时刻按用户实际行程确认。','返程','预留缓冲']]
  ];
  var wrap=document.getElementById("route-day-content");if(!wrap)return;
  wrap.innerHTML=data[day].map(function(x,i){var food=x[4].indexOf("美食")>=0||x[3].indexOf("餐")>=0;return '<div class="stop '+(food?'food':'')+'"><div class="stop-time">'+x[0]+'</div><div class="stop-line"><i class="stop-dot"></i></div><div class="stop-card" data-details="'+x[1]+'"><strong>'+x[1]+'</strong><p>'+x[2]+'</p><div class="stop-meta"><span class="pill '+(food?'amber':'gray')+'">'+x[3]+'</span><span class="pill blue">'+x[4]+'</span></div></div></div>'}).join("");
  toast("已切换到第 "+(Number(day)+1)+" 天的路线");
}
document.addEventListener("click",function(e){
  var page=e.target.closest("[data-page]");if(page){setPage(page.getAttribute("data-page"));return}
  var m=e.target.closest("[data-modal]");if(m){openModal(m.getAttribute("data-modal"),m.getAttribute("data-title"));return}
  if(e.target.closest("[data-close-modal]")){closeModal();return}
  if(e.target.id==="modal-backdrop"){closeModal();return}
  var approve=e.target.closest("[data-approve]");if(approve){var row=approve.closest("tr");row.setAttribute("data-state","matched");var label=row.querySelector(".state-label");label.textContent="已匹配";label.className="pill green state-label";toast("已通过审核，线索进入地点关联");return}
  var reject=e.target.closest("[data-reject]");if(reject){var r=reject.closest("tr");r.setAttribute("data-state","rejected");var l=r.querySelector(".state-label");l.textContent="已忽略";l.className="pill gray state-label";toast("已忽略该条攻略线索");return}
  var sf=e.target.closest("[data-source-filter]");if(sf){document.querySelectorAll("[data-source-filter]").forEach(function(b){b.classList.toggle("active",b===sf)});filterRows("#source-rows tr","data-state",sf.getAttribute("data-source-filter"));return}
  var pf=e.target.closest("[data-poi-type]");if(pf){document.querySelectorAll("[data-poi-type]").forEach(function(b){b.classList.toggle("active",b===pf)});filterRows("#content tbody tr[data-poi]","data-poi",pf.getAttribute("data-poi-type"));return}
  var tf=e.target.closest("[data-trip-filter]");if(tf){document.querySelectorAll("[data-trip-filter]").forEach(function(b){b.classList.toggle("active",b===tf)});filterRows("#content tbody tr[data-trip-state]","data-trip-state",tf.getAttribute("data-trip-filter"));return}
  var rd=e.target.closest("[data-route-day]");if(rd){document.querySelectorAll("[data-route-day]").forEach(function(b){b.classList.toggle("active",b===rd)});renderRouteDay(rd.getAttribute("data-route-day"));return}
  var rv=e.target.closest("[data-route-view]");if(rv){document.querySelectorAll("[data-route-view]").forEach(function(b){b.classList.toggle("active",b===rv)});var map=document.getElementById("route-map");map.style.minHeight=rv.getAttribute("data-route-view")==="compact"?"300px":"465px";toast(rv.getAttribute("data-route-view")==="compact"?"已切换简洁地图":"已切换完整地图");return}
  var details=e.target.closest("[data-details]");if(details){openModal("source",details.getAttribute("data-details"));document.getElementById("modal-body").innerHTML='<div class="source-box"><strong>'+details.getAttribute("data-details")+'</strong><p>推荐依据：结合用户时间、住宿起点、昼夜属性、天气适配和路线距离。示例页面不展示真实平台内容。</p><div class="source-list"><div class="source-item"><b>内容摘要</b><span>人工审核后保存原始链接、发布时间和地点匹配结果。</span></div><div class="source-item"><b>运营提醒</b><span>请核实营业信息、地点坐标与原文更新时间。</span></div></div></div>';return}
  var save=e.target.closest("[data-save-rules]");if(save){var total=document.getElementById("weight-total");if(total&&total.textContent!=="总计 100%"){toast("权重总和需为 100% 后再保存");return}toast("AI 推荐规则已保存");return}
  var action=e.target.closest("[data-toast]");if(action){toast(action.getAttribute("data-toast"));return}
});
document.addEventListener("input",function(e){
  if(e.target.matches("[data-weight]"))updateWeights(document.getElementById("content"));
  if(e.target.matches("[data-table-search]")){var q=e.target.value.toLowerCase();document.querySelectorAll("#content tbody tr").forEach(function(row){row.style.display=row.textContent.toLowerCase().indexOf(q)>=0?"":"none"})}
});
document.addEventListener("submit",function(e){if(e.target.id==="modal-form"){e.preventDefault();closeModal();toast("已保存草稿；正式版将进入审核或配置流程")}})
document.getElementById("mobile-menu").addEventListener("click",function(){document.getElementById("sidebar").classList.toggle("open")});
document.getElementById("city-filter").addEventListener("change",function(e){toast("已切换城市筛选："+e.target.value)});
document.getElementById("global-search").addEventListener("keydown",function(e){if(e.key==="Enter"){var q=e.target.value.trim();if(q){setPage("places");var input=document.querySelector("#content [data-table-search]");if(input){input.value=q;input.dispatchEvent(new Event("input",{bubbles:true}))}else toast("搜索："+q)}}});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeModal()});
setPage("overview");
</script>
</body>
</html>
